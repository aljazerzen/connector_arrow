services:
  postgres:
    image: docker.io/library/postgres:16-alpine
    ports: ['5432:5432']
    environment:
      POSTGRES_DB: db
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
    healthcheck:
      test: [CMD-SHELL, pg_isready -U user -d db]
      interval: 5s
      timeout: 5s
      retries: 5
  mysql:
    image: docker.io/library/mariadb:10
    ports: ['3306:3306']
    environment:
      MYSQL_DATABASE: db
      MYSQL_ROOT_PASSWORD: pass
    command: --secure-file-priv=""
    healthcheck:
      test: [CMD-SHELL, mysqladmin ping -h localhost -uroot -ppass]
      interval: 5s
      timeout: 5s
      retries: 5
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    ports: ['1433:1433']
    platform: linux/amd64
    environment:
      ACCEPT_EULA: Y
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: passwordA1
      LC_ALL: en_US.UTF-8
      MSSQL_COLLATION: Latin1_General_100_CS_AI_SC_UTF8
